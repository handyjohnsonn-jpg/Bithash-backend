name: Patch conversion authorization bug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore server baseline and patch conversion policy
        run: |
          set -euo pipefail
          git checkout fc784a75cb9012e0eece50018b836cffdbee1315 -- server.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')
          old = "        '/api/loans/repay',\n        '/api/convert'"
          if old not in s:
              raise SystemExit('expected sensitive route block not found')
          s = s.replace(old, "        '/api/loans/repay'", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify conversion endpoint and route policy
        run: |
          grep -F "app.post('/api/convert', protect, async (req, res) => {" server.js
          if grep -F "        '/api/convert'" server.js; then exit 1; fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --check
          git commit -m "fix conversion authorization logout [conversion-bugfix]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
