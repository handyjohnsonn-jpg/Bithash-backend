name: BitHash Backend Real Patch Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend source
        run: python3 .github/scripts/patch_conversion_bug.py
      - name: Commit backend patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Backend conversion patch already applied."
            exit 0
          fi
          git commit -m "fix conversion authorization logout [conversion-bugfix]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
